# Create a new customer
mutation CreateCustomer {
  createCustomer(input: {
    firstName: "Alice"
    lastName: "Johnson"
    email: "alice.johnson@example.com"
    phone: "+1-555-0105"
    address: "999 Broadway, Seattle, WA"
    dateOfBirth: "1992-07-20"
  }) {
    id
    firstName
    lastName
    email
    createdAt
  }
}

# Update customer
mutation UpdateCustomer {
  updateCustomer(id: 1, input: {
    phone: "+1-555-9999"
    address: "456 New Address, Boston, MA"
  }) {
    id
    firstName
    lastName
    phone
    address
    updatedAt
  }
}

# Delete customer
mutation DeleteCustomer {
  deleteCustomer(id: 5)
}
